# =============================================================================
# bot-cripto — Freqtrade na Binance Spot
#
# Subir:        docker compose up -d
# Logs:         docker compose logs -f --tail=200
# Parar:        docker compose down
# Comando avulso (backtest, download, etc.):
#               docker compose run --rm freqtrade <subcomando>
#
# A imagem oficial "stable" já traz TA-Lib, FreqUI e todas as dependências.
# Segredos vêm do arquivo .env (ver .env.example). Nada sensível aqui.
# =============================================================================
services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade
    restart: unless-stopped            # reinicia sozinho após queda ou reboot da VPS
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
    user: "${FT_UID:-1000}:${FT_GID:-1000}"
    volumes:
      - ./user_data:/freqtrade/user_data
    ports:
      # Só a própria VPS enxerga a porta. Acesso ao FreqUI via túnel SSH:
      #   ssh -L 8080:127.0.0.1:8080 usuario@IP_DA_VPS  ->  http://localhost:8080
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy ${FREQTRADE_STRATEGY:-PlaceholderStrategy}
    healthcheck:
      # /api/v1/ping não exige autenticação. Base para o health-check externo (n8n).
      test: ["CMD", "python3", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/api/v1/ping', timeout=5); sys.exit(0 if r.status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
